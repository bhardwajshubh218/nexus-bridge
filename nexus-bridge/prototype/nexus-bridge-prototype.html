<meta charset="utf-8">
<title>Nexus Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ---------- Tokens (light is the default, per the design spec) ---------- */
:root{
  color-scheme:light;
  --bg:#F8FAFC; --panel:#FFFFFF; --card:#FFFFFF; --card-2:#F8FAFC; --card-3:#F1F5F9; --code:#F8FAFC;
  --line:#E2E8F0; --line-2:#CBD5E1;
  --text:#0F172A; --text-2:#334155; --muted:#64748B; --faint:#94A3B8;
  --action:#2563EB; --action-hi:#1D4ED8; --action-bg:#EFF6FF; --action-line:#BFDBFE; --on-action:#FFFFFF;
  --ok:#10B981; --ok-text:#047857; --ok-bg:#ECFDF5; --ok-line:#A7F3D0;
  --warn:#F59E0B; --warn-text:#B45309; --warn-bg:#FFFBEB; --warn-line:#FDE68A;
  --bad:#EF4444; --bad-text:#B91C1C; --bad-bg:#FEF2F2; --bad-line:#FECACA;
  --k:#334155; --s:#047857; --n:#B45309; --b:#2563EB;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,.08), 0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.28);
  --scrim:rgba(15,23,42,.35);
  --r-lg:12px; --r-md:10px; --r-sm:8px;
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
/* Optional dark look (toggle in the header) */
html[data-app-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0F0E; --panel:#161716; --card:#1A1B1A; --card-2:#202120; --card-3:#272827; --code:#141514;
  --line:#272827; --line-2:#343534;
  --text:#ECEDEC; --text-2:#C4C6C4; --muted:#8E918E; --faint:#5F625F;
  --action:#3B82F6; --action-hi:#60A5FA; --action-bg:#14203A; --action-line:#1F3A66; --on-action:#FFFFFF;
  --ok:#2EC48A; --ok-text:#4BD9A0; --ok-bg:#0F241B; --ok-line:#1D4634;
  --warn:#EAB04E; --warn-text:#EAB04E; --warn-bg:#261E10; --warn-line:#4A3918;
  --bad:#EE6B6B; --bad-text:#F08A8A; --bad-bg:#281414; --bad-line:#4A2323;
  --k:#C9CCC9; --s:#9FD9BE; --n:#E6C98F; --b:#A9B8F0;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-md:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -14px rgba(0,0,0,.75);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.85);
  --scrim:rgba(5,6,5,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--sans); padding-inline:16px; padding-block:14px 96px; -webkit-font-smoothing:antialiased}
button,select{font:inherit; color:inherit}
h1,h2,h3{margin:0; font-weight:600; text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono); font-size:.9em; letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.ic{flex:none; display:block}
:focus-visible{outline:2px solid var(--action); outline-offset:2px; border-radius:6px}

/* ---------- Shell ---------- */
.app{display:grid; grid-template-columns:240px minmax(0,1fr); gap:14px; max-width:1480px; margin:0 auto}
.sidebar{position:sticky; top:14px; align-self:start; height:calc(100vh - 28px); background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:20px; padding:14px}
.brand{display:flex; align-items:center; gap:10px; padding:4px 6px}
.brand-mark{width:32px; height:32px; border-radius:9px; background:var(--text); display:grid; place-items:center; color:var(--panel)}
.brand b{display:block; font-size:14px; font-weight:600}
.brand span{display:block; font-size:11.5px; color:var(--muted)}
.nav{display:flex; flex-direction:column; gap:2px}
.nav-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:8px 8px 6px; font-weight:500}
.nav-item{display:flex; align-items:center; gap:10px; min-height:38px; padding:0 10px; border-radius:var(--r-sm); border:1px solid transparent; background:none; color:var(--text-2); cursor:pointer; text-align:left; width:100%; font-size:13.5px; font-weight:500}
.nav-item:hover{background:var(--card-3); color:var(--text)}
.nav-item.active{background:var(--action-bg); border-color:var(--action-line); color:var(--action)}
.nav-item .ic{color:var(--muted)}
.nav-item.active .ic{color:var(--action)}
.nav-item .count{margin-left:auto; font-size:11.5px; min-width:20px; height:20px; padding:0 6px; border-radius:999px; display:grid; place-items:center; background:var(--warn-bg); color:var(--warn-text); border:1px solid var(--warn-line); font-weight:600}
.nav-item .count.zero{background:var(--card-3); color:var(--muted); border-color:var(--line)}
.nav-item .n-sub{display:block; font-size:11px; color:var(--faint); font-weight:400}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.sources{display:flex; flex-direction:column; gap:8px; padding:12px; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-md)}
.sources-head{display:flex; justify-content:space-between; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:500}
.src-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2)}
.src-row .mono{margin-left:auto; color:var(--muted); font-size:11px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-bg); flex:none}
.sim-note{font-size:11.5px; color:var(--muted); line-height:1.45; display:flex; gap:6px}
.sim-note .ic{color:var(--warn); margin-top:2px}

main{display:flex; flex-direction:column; gap:16px; min-width:0}
.topbar-wrap{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); padding-top:14px; margin-top:-14px}
.topbar{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:10px 12px 10px 16px}
.crumb{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:280px}
.crumb b{color:var(--text); font-weight:600}
.top-search{position:relative; flex:1; max-width:560px; margin-inline:auto}
.top-right{display:flex; align-items:center; gap:8px}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--card-3); border:1px solid var(--line); display:grid; place-items:center; font-size:12px; font-weight:600; color:var(--text-2)}

/* ---------- Primitives ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); min-width:0}
.card-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.card-head h2{font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px}
.card-head h2 .ic{color:var(--muted)}
.card-head .right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.card-body{padding:16px}
.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; background:var(--card-3); border:1px solid var(--line); color:var(--text-2)}
.pill.ok{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-text)}
.pill.warn{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-text)}
.pill.bad{background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad-text)}
.pill.info{background:var(--action-bg); border-color:var(--action-line); color:var(--action)}
.pill.sm{height:20px; padding:0 8px; font-size:11px}
.pill.caps{letter-spacing:.05em; font-size:10.5px; font-weight:600; text-transform:uppercase}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 14px; border-radius:var(--r-sm); border:1px solid var(--line-2); background:var(--card); color:var(--text); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; box-shadow:var(--shadow); transition:background .15s, border-color .15s}
.btn:hover{background:var(--card-3)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn-primary{background:var(--action); color:var(--on-action); border-color:transparent}
.btn-primary:hover{background:var(--action-hi)}
.btn-danger{color:var(--bad-text); border-color:var(--bad-line)}
.btn-danger:hover{background:var(--bad-bg)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--muted); box-shadow:none}
.btn-ghost:hover{background:var(--card-3); color:var(--text)}
.btn-lg{height:46px; padding:0 22px; font-size:14.5px}
.btn-sm{height:30px; padding:0 10px; font-size:12.5px}
.btn-icon{width:34px; padding:0}
.chip{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text-2); font-size:12.5px; cursor:pointer}
.chip:hover{border-color:var(--action-line); color:var(--action)}
.chip.warn{border-color:var(--warn-line); color:var(--warn-text); background:var(--warn-bg)}
.chip.bad{border-color:var(--bad-line); color:var(--bad-text); background:var(--bad-bg)}
.kbd{font:500 11px var(--mono); color:var(--muted); border:1px solid var(--line); background:var(--card-3); border-radius:6px; padding:2px 6px}
.select{height:32px; border-radius:var(--r-sm); border:1px solid var(--line-2); background:var(--card); color:var(--text); padding:0 28px 0 10px; font-size:12.5px; cursor:pointer}
.field{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}

.search{display:flex; align-items:center; gap:10px; height:40px; padding:0 8px 0 12px; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-md)}
.search:focus-within{border-color:var(--action); box-shadow:0 0 0 3px var(--action-bg); background:var(--card)}
.search .ic{color:var(--muted)}
.search input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font:14px var(--sans)}
.search input::placeholder{color:var(--faint)}
.search.xl{height:58px; padding:0 8px 0 18px; border-radius:12px; background:var(--card)}
.search.xl input{font-size:16px}
.dropdown{position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); padding:6px; z-index:50}
.dd-item{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:8px; background:none; border:0; cursor:pointer; text-align:left}
.dd-item:hover,.dd-item.hl{background:var(--card-3)}
.dd-item .mono{color:var(--text)}
.dd-item .sub{color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dd-item .pill{margin-left:auto}
.dd-foot{display:flex; justify-content:space-between; gap:10px; padding:8px 10px 4px; border-top:1px solid var(--line); margin-top:4px; font-size:11.5px; color:var(--faint)}

.page-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
.page-head h1{font-size:22px; letter-spacing:-.015em}
.page-head p{color:var(--muted); margin-top:4px; max-width:78ch}
.page-head .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--action); font-weight:600}

.table-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--line); background:var(--card-2); white-space:nowrap}
td{padding:11px 14px; border-bottom:1px solid var(--line); color:var(--text-2); vertical-align:middle; white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
td.r,th.r{text-align:right}
.id{font-family:var(--mono); font-size:12.5px; color:var(--text)}
.idlink{font-family:var(--mono); font-size:12.5px; color:var(--action); background:none; border:0; padding:0; cursor:pointer}
.idlink:hover{text-decoration:underline; text-underline-offset:3px}
.idlink.self{color:var(--text); font-weight:600; cursor:default; text-decoration:none}

.grid{display:grid; gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.view{display:flex; flex-direction:column; gap:16px}
.sim-tag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--warn-text); background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:6px; padding:1px 6px}

/* ---------- Overview ---------- */
.hero{padding:28px; display:flex; flex-direction:column; gap:18px}
.hero h1{font-size:26px; letter-spacing:-.02em}
.hero p{color:var(--muted); max-width:66ch}
.hero .search-box{position:relative; max-width:780px}
.try{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.try .label{font-size:12px; color:var(--faint); margin-right:2px; min-width:74px}
.kpi{padding:16px; display:flex; flex-direction:column; gap:6px}
.kpi .label{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; justify-content:space-between}
.kpi .val{font-size:28px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px; color:var(--muted); font-weight:500; margin-left:2px}
.kpi .foot{font-size:12px; color:var(--faint)}
.flow{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:10px; align-items:stretch; padding:16px}
.flow-step{border:1px solid var(--line); border-radius:var(--r-md); padding:14px; background:var(--card-2); display:flex; flex-direction:column; gap:8px}
.flow-step h3{font-size:14px; display:flex; align-items:center; gap:8px}
.flow-step p{font-size:12.5px; color:var(--muted); flex:1}
.flow-step .ic-b{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--action-bg); color:var(--action); border:1px solid var(--action-line)}
.flow-step.w .ic-b{background:var(--warn-bg); color:var(--warn-text); border-color:var(--warn-line)}
.flow-arrow{display:grid; place-items:center; color:var(--faint)}

/* ---------- Entity ---------- */
.back{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); background:none; border:0; cursor:pointer; padding:0; align-self:flex-start}
.back:hover{color:var(--text)}
.back .ic{transform:rotate(180deg)}
.ent-head{padding:20px; display:flex; flex-direction:column; gap:16px}
.ent-top{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.ent-logo{width:48px; height:48px; border-radius:12px; background:var(--card-3); border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:16px; color:var(--text-2); flex:none}
.ent-title{display:flex; flex-direction:column; gap:8px; min-width:0}
.ent-title h1{font-size:22px; letter-spacing:-.015em}
.ent-title .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.ent-title .sub{font-size:13px; color:var(--muted)}
.ent-actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.meta{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; margin:0}
.meta div{background:var(--card-2); padding:10px 14px; min-width:0}
.meta dt{font-size:11.5px; color:var(--muted)}
.meta dd{margin:2px 0 0; font-size:14px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta dd.ok{color:var(--ok-text)}
.trace{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); padding:10px 14px; border-radius:var(--r-md); background:var(--code); border:1px dashed var(--line-2)}
.trace .id{font-size:12px}
.trace .arrow{color:var(--faint)}
.trace .rule{font-family:var(--mono); font-size:11.5px; color:var(--ok-text); background:var(--ok-bg); border:1px solid var(--ok-line); border-radius:6px; padding:1px 7px}
.trace .sep{width:1px; height:14px; background:var(--line-2)}
.banner{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-md); font-size:13px; color:var(--text-2)}
.banner.ok{background:var(--ok-bg); border:1px solid var(--ok-line)}
.banner.warn{background:var(--warn-bg); border:1px solid var(--warn-line)}
.banner.info{background:var(--action-bg); border:1px solid var(--action-line)}
.banner.bad{background:var(--bad-bg); border:1px solid var(--bad-line)}
.banner .ic{margin-top:2px}
.banner.ok .ic{color:var(--ok-text)} .banner.warn .ic{color:var(--warn-text)} .banner.info .ic{color:var(--action)} .banner.bad .ic{color:var(--bad-text)}

.tree,.tree ul{list-style:none; margin:0; padding:0}
.tree ul{padding-left:20px; margin-left:12px; border-left:1px dashed var(--line-2)}
.tree-wrap{padding:10px 12px 14px; overflow-x:auto}
.tn{display:flex; align-items:center; gap:8px; min-height:36px; padding:3px 8px; border-radius:8px; min-width:max-content}
.tn:hover{background:var(--card-2)}
.tn.current{background:var(--ok-bg); box-shadow:0 0 0 1px var(--ok-line) inset}
.tw{width:22px; height:22px; display:grid; place-items:center; border:0; background:none; cursor:pointer; color:var(--muted); border-radius:6px; flex:none}
.tw:hover{background:var(--card-3); color:var(--text)}
.tw .ic{transition:transform .15s}
.tw.open .ic{transform:rotate(90deg)}
.tw-sp{width:22px; flex:none}
.tchip{font:600 10px var(--sans); letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:5px; border:1px solid var(--line-2); color:var(--text-2); background:var(--card); white-space:nowrap; min-width:64px; text-align:center}
.tchip.ses{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-text)}
.tchip.sub{background:var(--action-bg); border-color:var(--action-line); color:var(--action)}
.tchip.pi{background:var(--card-3); border-color:var(--line); color:var(--muted)}
.tchip.dis{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-text)}
.tn .id{font-size:12.5px}
.tn .lbl{color:var(--text-2); font-size:13px}
.tn .meta-r{margin-left:auto; padding-left:18px; font-size:12px; color:var(--faint); display:flex; gap:8px; align-items:center}
.tn.grp .lbl{font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.rule-tag{font-family:var(--mono); font-size:11px; color:var(--text-2); background:var(--card-3); border-radius:5px; padding:1px 6px}

.ccy{border:1px solid var(--line); border-radius:var(--r-md); padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--card-2)}
.ccy-h{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted)}
.ccy-h b{font:600 13px var(--mono); color:var(--text)}
.ccy-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.ccy-grid .l{font-size:11.5px; color:var(--muted)}
.ccy-grid .v{font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.ccy-grid .v.pend{color:var(--warn-text)}
.fin{display:flex; flex-direction:column; gap:12px}
.amt-in{color:var(--ok-text)} .amt-out{color:var(--text-2)}
tr.fresh{animation:rowIn 2.2s ease-out}
@keyframes rowIn{0%{background:var(--ok-bg)}100%{background:transparent}}
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.empty-state{padding:36px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px}
.empty-state .ic-wrap{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--card-3); border:1px solid var(--line); color:var(--muted)}
.empty-state .ic-wrap.warn{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-text)}
.empty-state .ic-wrap.bad{background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad-text)}
.empty-state .ic-wrap.ok{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-text)}
.empty-state h2{font-size:17px}
.empty-state p{color:var(--muted); max-width:60ch}
.cands{display:flex; flex-direction:column; gap:8px; width:100%; max-width:560px; text-align:left}
.cand{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--card-2)}
.results{display:flex; flex-direction:column}
.res{display:flex; align-items:center; gap:14px; padding:14px 16px; border:0; border-bottom:1px solid var(--line); background:none; width:100%; text-align:left; cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover{background:var(--card-2)}
.res .name{font-weight:600}
.res .sub{font-size:12.5px; color:var(--muted)}
.res .pill{margin-left:auto}

/* ---------- Simulator ---------- */
.seg{display:inline-flex; padding:3px; gap:2px; background:var(--card-3); border:1px solid var(--line); border-radius:10px; flex-wrap:wrap}
.seg button{height:30px; padding:0 12px; border-radius:8px; border:0; background:none; color:var(--muted); font-size:12.5px; font-weight:500; cursor:pointer}
.seg button.active{background:var(--card); color:var(--text); box-shadow:var(--shadow)}
.seg button[disabled]{cursor:not-allowed}
.pipe{display:flex; align-items:center; padding:16px; overflow-x:auto}
.stage{display:flex; align-items:center; gap:10px; flex:none}
.stage .b{width:28px; height:28px; border-radius:50%; border:1px solid var(--line-2); background:var(--card); display:grid; place-items:center; color:var(--faint); font:500 11.5px var(--mono)}
.stage .t{font-size:12.5px; color:var(--muted); line-height:1.25}
.stage .t span{display:block; font-size:11px; color:var(--faint); font-family:var(--mono)}
.stage.active .b{border-color:var(--action); color:var(--action); box-shadow:0 0 0 4px var(--action-bg)}
.stage.done .b{background:var(--ok); border-color:var(--ok); color:#fff}
.stage.done .t,.stage.active .t{color:var(--text)}
.stage.fail .b{background:var(--bad); border-color:var(--bad); color:#fff}
.stage.fail .t{color:var(--bad-text)}
.stage.skip{opacity:.4}
.connector{flex:1; min-width:22px; height:1.5px; background:var(--line-2); margin:0 10px}
.connector.done{background:var(--ok)}
.panes{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
.pane{display:flex; flex-direction:column}
.pane-sub{padding:10px 16px; font-size:12.5px; border-bottom:1px solid var(--line); color:var(--muted)}
.code{margin:14px; background:var(--code); border:1px solid var(--line); border-radius:10px; font:12.5px/1.75 var(--mono); overflow:auto; padding:10px 0; min-height:330px}
.code-line{display:flex; border-left:3px solid transparent; padding-right:14px}
.ln{width:38px; text-align:right; padding-right:12px; color:var(--faint); user-select:none; flex:none}
.lc{white-space:pre; flex:1}
.k{color:var(--k)} .s{color:var(--s)} .nm{color:var(--n)} .bo{color:var(--b)} .p{color:var(--faint)}
.code-line.inj{background:var(--ok-bg); border-left-color:var(--ok); animation:flash 1.8s ease-out}
.code-line.inj .k{color:var(--ok-text); font-weight:600}
.code-line.inj2{background:var(--action-bg); border-left-color:var(--action-line)}
.code-line.inj2 .k{color:var(--action)}
.code-line.held{background:var(--warn-bg); border-left-color:var(--warn)}
.code-line.held .k{color:var(--warn-text); font-weight:600}
@keyframes flash{0%{background:#FEF08A}100%{background:var(--ok-bg)}}
.tag{font:600 10px var(--sans); letter-spacing:.04em; text-transform:uppercase; color:var(--ok-text); border:1px solid var(--ok-line); background:var(--card); border-radius:999px; padding:0 8px; line-height:18px; align-self:center; margin-left:12px; white-space:nowrap}
.inj2 .tag{color:var(--action); border-color:var(--action-line)}
.held .tag{color:var(--warn-text); border-color:var(--warn-line)}
.code-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; color:var(--faint); font-size:13px; min-height:330px; margin:14px; border:1px dashed var(--line-2); border-radius:10px}
.spinner{width:22px; height:22px; border-radius:50%; border:2px solid var(--line-2); border-top-color:var(--action); animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legend-row{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); padding:0 16px 14px}
.legend-row span{display:inline-flex; align-items:center; gap:6px}
.legend-row i{width:10px; height:10px; border-radius:3px; display:inline-block; border-left:3px solid}
.run-bar{display:flex; align-items:center; gap:18px; padding:16px 18px; flex-wrap:wrap}
.run-bar .desc{flex:1; min-width:240px; font-size:13px; color:var(--text-2)}
.run-bar .desc .muted{display:block; font-size:12px; margin-top:2px}
.checks{display:flex; flex-direction:column}
.check{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:start; padding:11px 16px; border-top:1px solid var(--line); font-size:13px}
.check .ci{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; margin-top:1px}
.check.ok .ci{background:var(--ok-bg); color:var(--ok-text)}
.check.bad .ci{background:var(--bad-bg); color:var(--bad-text)}
.check.warn .ci{background:var(--warn-bg); color:var(--warn-text)}
.check b{font-weight:600; color:var(--text)}
.check .d{display:block; color:var(--muted); font-size:12.5px; margin-top:1px}
.check-foot{padding:10px 16px 14px; font-size:11.5px; color:var(--faint); border-top:1px solid var(--line)}

/* ---------- Queue ---------- */
.tabs{display:inline-flex; gap:2px; padding:3px; background:var(--card-3); border:1px solid var(--line); border-radius:10px}
.tabs button{height:30px; padding:0 12px; border:0; border-radius:8px; background:none; color:var(--muted); font-size:12.5px; font-weight:500; cursor:pointer}
.tabs button.active{background:var(--card); color:var(--text); box-shadow:var(--shadow)}
.reason{white-space:normal; min-width:220px; max-width:320px}
tr.leaving{opacity:0; transform:translateX(24px); transition:opacity .35s, transform .35s}
.held-n{display:block; font-size:11.5px; color:var(--warn-text); margin-top:2px}

/* ---------- Slide-over ---------- */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:60; opacity:0; transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed; top:0; right:0; bottom:0; width:min(700px,100%); background:var(--panel); border-left:1px solid var(--line); box-shadow:var(--shadow-lg); z-index:61; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); padding-top:env(safe-area-inset-top,0px)}
.sheet.open{transform:none}
.sheet-head{display:flex; gap:12px; align-items:flex-start; padding:18px 20px; border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:17px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.sheet-head p{font-size:12.5px; color:var(--muted); margin-top:4px}
.sheet-body{flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:16px}
.sheet-foot{border-top:1px solid var(--line); padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; background:var(--panel)}
.sheet-foot .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.sheet-foot .hint{font-size:12px; color:var(--muted)}
.sec-title{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.cmp-table{border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden}
.cmp-table table{font-size:12.5px}
.cmp-table th{text-transform:none; letter-spacing:0; font-size:12px; font-weight:500; color:var(--muted); padding:10px 12px; vertical-align:top}
.cmp-table th .id{display:block; font-size:12px; margin-top:2px; font-weight:600}
.cmp-table th .nm2{display:block; font-size:11.5px; color:var(--faint)}
.cmp-table td{padding:10px 12px; white-space:normal}
.cmp-table td:first-child{color:var(--muted); width:22%}
.cmp-table tr.conflict td{background:var(--bad-bg)}
.cmp-table tr.conflict td:nth-child(2){color:var(--bad-text); font-weight:600}
.cmp-table tr.missing td,.cmp-table tr.split td{background:var(--warn-bg)}
.cmp-table td.eq{color:var(--ok-text); font-weight:600}
.st{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; white-space:nowrap}
.st.match{color:var(--ok-text)} .st.similar{color:var(--action)} .st.conflict{color:var(--bad-text)} .st.missing,.st.split{color:var(--warn-text)} .st.info{color:var(--faint)}
.why{border:1px solid var(--warn-line); background:var(--warn-bg); border-radius:var(--r-md); padding:14px; display:flex; flex-direction:column; gap:6px}
.why.bad{border-color:var(--bad-line); background:var(--bad-bg)}
.why .h{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--warn-text)}
.why.bad .h{color:var(--bad-text)}
.why p{font-size:13px; color:var(--text-2); line-height:1.55}
.evid{border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden}
.evid .row{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 12px; border-top:1px solid var(--line); font-size:13px}
.evid .row:first-child{border-top:0}
.evid .ci{width:20px; height:20px; border-radius:50%; display:grid; place-items:center}
.evid .ok .ci{background:var(--ok-bg); color:var(--ok-text)}
.evid .no .ci{background:var(--bad-bg); color:var(--bad-text)}
.evid .row span.d{font-size:12px; color:var(--muted)}
.evid .verdict{padding:10px 12px; font-size:12.5px; font-weight:600; border-top:1px solid var(--line)}
.evid .verdict.ok{background:var(--ok-bg); color:var(--ok-text)}
.evid .verdict.no{background:var(--card-2); color:var(--bad-text)}
.note{border:1px solid var(--line); border-radius:var(--r-md); padding:14px; background:var(--card-2); display:flex; flex-direction:column; gap:8px}
.note .h{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--text-2)}
.note p{font-size:13.5px; line-height:1.55}
.suppl{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); flex-wrap:wrap}
.suppl .bar{position:relative; width:110px; height:6px; border-radius:999px; background:var(--card-3)}
.suppl .bar i{position:absolute; inset:0 auto 0 0; border-radius:999px; background:var(--faint)}
.guard{border:1px solid var(--action-line); background:var(--action-bg); border-radius:var(--r-md); padding:12px; display:flex; flex-direction:column; gap:10px}
.guard p{font-size:13px; color:var(--text-2)}

/* ---------- Activity ---------- */
.actor{display:flex; align-items:center; gap:8px}
.actor i{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:9.5px; font-weight:700; background:var(--card-3); color:var(--text-2); border:1px solid var(--line); flex:none}
.actor i.sys{background:var(--text); color:var(--panel); border-color:var(--text)}
.detail{white-space:normal; min-width:260px; color:var(--muted)}

/* ---------- Toasts & guide ---------- */
.toasts{position:fixed; right:16px; top:calc(80px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:8px; z-index:80; width:min(440px, calc(100% - 32px)); pointer-events:none}
.toast{pointer-events:auto; display:flex; align-items:center; gap:10px; padding:11px 12px 11px 14px; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:10px; box-shadow:var(--shadow-lg); font-size:13px; animation:toastIn .25s ease-out}
.toast .ic{color:var(--ok-text)}
.toast.warn{border-left-color:var(--warn)} .toast.warn .ic{color:var(--warn-text)}
.toast.bad{border-left-color:var(--bad)} .toast.bad .ic{color:var(--bad-text)}
.toast.info{border-left-color:var(--action)} .toast.info .ic{color:var(--action)}
.toast .msg{flex:1; font-weight:500}
.toast .msg span{display:block; font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:1px; font-weight:400}
.toast.out{opacity:0; transform:translateY(-6px); transition:all .25s}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px)}}
.sheet.open ~ .toasts{right:calc(min(700px,100%) + 16px)}
@media (max-width:1180px){ .sheet.open ~ .toasts{right:16px; top:auto; bottom:calc(150px + env(safe-area-inset-bottom,0px))} }
.guide{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:320px; z-index:40; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-lg)}
.guide-head{display:flex; align-items:center; gap:10px; padding:12px 12px 12px 14px; cursor:pointer; background:none; border:0; width:100%; text-align:left}
.guide-head b{font-size:13px; font-weight:600}
.guide-head .prog{font-size:12px; color:var(--muted); margin-left:auto}
.guide-head .chev{color:var(--muted); transform:rotate(90deg); transition:transform .2s}
.guide.collapsed .guide-head .chev{transform:rotate(-90deg)}
.guide-bar{height:2px; background:var(--line); margin:0 14px}
.guide-bar i{display:block; height:100%; background:var(--action); transition:width .3s}
.guide-steps{list-style:none; margin:0; padding:8px; display:flex; flex-direction:column; gap:2px}
.guide-next{display:none; align-items:center; gap:10px; padding:0 12px 12px 14px; font-size:12.5px; color:var(--text-2)}
.guide-next span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.guide.collapsed .guide-steps,.guide.collapsed .guide-foot,.guide.collapsed .guide-bar{display:none}
.guide.collapsed .guide-next{display:flex}
.gs{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px; border-radius:8px}
.gs .b{width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2); display:grid; place-items:center; font:500 11px var(--mono); color:var(--faint)}
.gs .t{font-size:12.5px; color:var(--muted); line-height:1.3}
.gs .t span{display:block; font-size:11.5px; color:var(--faint)}
.gs.done .b{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-text)}
.gs.done .t{color:var(--text-2)}
.gs.next{background:var(--action-bg)}
.gs.next .b{border-color:var(--action); color:var(--action)}
.gs.next .t{color:var(--text)}
.gs .go{height:26px; padding:0 10px; font-size:12px}
.guide-foot{display:flex; justify-content:space-between; align-items:center; padding:4px 14px 12px; font-size:11.5px; color:var(--faint)}

/* ---------- Responsive ---------- */
@media (max-width:1200px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static; height:auto; flex-direction:row; align-items:center; gap:12px; padding:10px; overflow-x:auto}
  .brand span,.nav-label,.side-foot,.nav-item .n-sub{display:none}
  .nav{flex-direction:row}
  .nav-item{width:auto; white-space:nowrap}
  .crumb{display:none}
  .panes{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow-arrow{transform:rotate(90deg)}
  .guide{width:calc(100% - 32px)}
}
@media (max-width:640px){
  .g-kpi{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccy-grid{grid-template-columns:minmax(0,1fr)}
  .hero{padding:20px}
  .top-search .kbd,.top-right .pill{display:none}
}

/* ---------- Identity layer: bridge, gate chain, routing, events ---------- */
.bridge{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; padding:16px}
.bstep{border:1px solid var(--line); border-radius:var(--r-md); background:var(--card-2); padding:12px; display:flex; flex-direction:column; gap:6px; position:relative; min-width:0}
.bstep.hub{border-color:var(--ok-line); background:var(--ok-bg)}
.bstep .n{font:500 11px var(--mono); color:var(--faint)}
.bstep h3{font-size:13px}
.bstep p{font-size:12px; color:var(--muted)}
.bstep .ids{display:flex; flex-wrap:wrap; gap:4px}
.bstep:not(:last-child)::after{content:""; position:absolute; right:-7px; top:50%; width:4px; height:4px; border-top:1.5px solid var(--faint); border-right:1.5px solid var(--faint); transform:translateY(-50%) rotate(45deg)}
details.tech{border-top:1px solid var(--line)}
details.tech > summary,.tech-card > summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; padding:12px 16px; font-size:12.5px; color:var(--muted)}
details.tech > summary::-webkit-details-marker,.tech-card > summary::-webkit-details-marker{display:none}
details.tech > summary .ic,.tech-card > summary .ic{transition:transform .15s}
details.tech[open] > summary .ic,.tech-card[open] > summary .ic{transform:rotate(90deg)}
.tech-card > summary b{color:var(--text); font-weight:600; font-size:13.5px}
.tech-body{padding:0 16px 16px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.tech-item{border:1px solid var(--line); border-radius:var(--r-md); background:var(--card-2); padding:12px; min-width:0}
.tech-item h4{margin:0 0 6px; font-size:12px; font-weight:600; color:var(--text-2)}
.tech-item p{font-size:12px; color:var(--muted); line-height:1.5}
.tech-item p.mono{color:var(--text-2); word-break:break-all}
pre.snip{margin:8px 0 0; font:11.5px/1.6 var(--mono); color:var(--text-2); background:var(--code); border:1px solid var(--line); border-radius:8px; padding:8px 10px; overflow-x:auto; white-space:pre}
.chain{padding:10px 16px 14px; display:flex; flex-direction:column}
.chain-row{display:grid; grid-template-columns:22px 150px minmax(0,1fr); gap:12px; align-items:center; padding:6px 0; position:relative}
.chain-row:not(:last-child)::after{content:""; position:absolute; left:10px; top:28px; bottom:-6px; width:1.5px; background:var(--line-2)}
.chain-row .ci{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--card-3); color:var(--faint); position:relative; z-index:1}
.chain-row.ok .ci{background:var(--ok-bg); color:var(--ok-text)}
.chain-row.fail .ci{background:var(--bad-bg); color:var(--bad-text)}
.chain-row .l{font-size:12px; color:var(--muted)}
.chain-row .v{font-size:13px; color:var(--text); display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-width:0}
.chain-row.fail .v{color:var(--bad-text); font-weight:600}
.chain-row.skip{opacity:.42}
.chain-row.final .v{font-weight:600}
.chain-row.final.ok .v{color:var(--ok-text)}
.prod{display:inline-flex; align-items:center; gap:4px; font:500 11.5px var(--mono); padding:1px 8px; border-radius:999px; border:1px solid var(--line-2); color:var(--text-2)}
.prod.on{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-text)}
.prod.off{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-text)}
.prod.no{color:var(--faint)}
.prod.req{outline:1.5px solid var(--text-2); outline-offset:1px}
.route-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; padding:16px}
.rrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; flex-wrap:wrap}
.rrow:last-child{border-bottom:0}
.rrow .r{margin-left:auto}
.rrow .sub{flex-basis:100%; font-size:12px; color:var(--faint); margin-top:-4px}
.ev-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:0 16px 12px; font-size:12.5px}
.ev{display:grid; grid-template-columns:100px 230px minmax(0,1fr) auto; gap:12px; padding:9px 16px; border-top:1px solid var(--line); font-size:12.5px; align-items:center}
.ev .topic{font:500 11.5px var(--mono); color:var(--ok-text)}
.seg-group{display:flex; flex-direction:column; gap:4px; align-items:flex-end}
.seg-label{font-size:11px; color:var(--faint)}
@media (max-width:1200px){ .bridge{grid-template-columns:repeat(3,minmax(0,1fr))} .route-grid,.tech-body{grid-template-columns:minmax(0,1fr)} .ev{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .bridge{grid-template-columns:minmax(0,1fr)} .bstep::after{display:none} .chain-row{grid-template-columns:22px minmax(0,1fr)} .chain-row .v{grid-column:2} .seg-group{align-items:flex-start} }
@media (prefers-reduced-motion:reduce){

/* ============ Nexus Registry: resolution rules ============ */
/* Rule 1 exact unique mapping · Rule 2 missing · Rule 3 conflict · Rule 4 ambiguous */
function mappingsFor(id) { const n = norm(id); return S.registry.filter(r => norm(r.legacy) === n); }
function resolveId(raw) {
  const n = norm(raw);
  const ent = Object.values(S.entities).find(e => norm(e.id) === n);
  if (ent) return { status: 'resolved', canonical: ent.id, via: ent.id, rule: 'canonical_id' };
  const maps = mappingsFor(raw);
  const ex = S.exceptions.find(x => norm(x.legacy) === n);
  if (maps.length === 1 && !ex) return { status: 'resolved', canonical: maps[0].canonical, via: maps[0].legacy, rule: maps[0].rule, mapping: maps[0] };
  if (maps.length > 1) return { status: 'ambiguous', via: maps[0].legacy, candidates: maps.map(m => m.canonical), ex };
  if (ex && ex.type === 'conflict') return { status: 'conflict', via: ex.legacy, ex };
  const closed = S.closed.find(x => norm(x.legacy) === n);
  return { status: 'not_found', via: raw, ex, closed };
}
const linksOf = id => S.registry.filter(r => r.canonical === id && mappingsFor(r.legacy).length === 1);
const disputedOf = id => S.registry.filter(r => r.canonical === id && mappingsFor(r.legacy).length > 1);
const childrenOf = id => Object.values(S.entities).filter(e => e.parent === id);
const txnsFor = id => S.txns.filter(t => t.src_can === id || t.dst_can === id);
const openCount = () => S.exceptions.length;

}[r.status]);

function suggestions(q) {
  const n = norm(q); if (!n) return [];
  const out = [], seen = new Set();
  const push = o => { if (!seen.has(o.label)) { seen.add(o.label); out.push(o); } };
  Object.values(S.entities).forEach(e => {
    if (norm(e.id).includes(n)) push({ q: e.id, label: e.id, mono: true, sub: e.name, pill: ['ok', 'Canonical'] });
    if (norm(e.name).includes(n)) push({ q: e.id, label: e.name, sub: e.id, pill: ['ok', 'Canonical'] });
  });
  const legacyIds = [...new Set([...S.registry.map(r => r.legacy), ...S.exceptions.map(x => x.legacy)])];
  legacyIds.forEach(id => {
    if (!norm(id).includes(n)) return;
    const r = resolveId(id);
    if (r.status === 'resolved') push({ q: id, label: id, mono: true, sub: `→ ${r.canonical} · ${S.entities[r.canonical].name}`, pill: ['', sysOf(id)] });
    else push({ q: id, label: id, mono: true, sub: r.status === 'ambiguous' ? `Maps to ${r.candidates.length} entities · in review` : r.status === 'conflict' ? 'Conflicting identity · in review' : 'No registry mapping', pill: [r.status === 'conflict' ? 'bad' : 'warn', 'Unresolved'] });
  });
  S.exceptions.forEach(x => { if (norm(x.name).includes(n)) push({ q: x.legacy, label: x.name, sub: `${x.legacy} · in review ${x.id}`, pill: ['warn', 'Unresolved'] }); });
  return out.slice(0, 8);
}

  let hl = -1, list = [];

    if (!list.length) { dd.innerHTML = `<div class="dd-foot" style="border:0;margin:0"><span>No ID or name contains “${esc(input.value)}”. Press Enter to check the registry anyway.</span></div>`; dd.hidden = false; return; }

    dd.hidden = false;
  };
  input.addEventListener('input', () => { hl = -1; draw(); });

  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(hl + 1, list.length - 1); draw(); }

    else if (e.key === 'Enter') { e.preventDefault(); const pick = hl >= 0 ? list[hl].q : input.value; dd.hidden = true; input.blur(); resolve(pick); }
  });
  dd.addEventListener('mousedown', e => { const b = e.target.closest('.dd-item'); if (!b) return; e.preventDefault(); dd.hidden = true; input.blur(); resolve(list[+b.dataset.i].q); });
}

/* Search entry point: identifiers go through the registry; names only return candidates */
function resolve(raw) {
  const q = String(raw || '').trim(); if (!q) return;
  const looksLikeId = /\d/.test(q);
  let r = resolveId(q);
  if (r.status === 'not_found' && !r.ex && !r.closed && !looksLikeId) {
    const n = norm(q);
    const ents = Object.values(S.entities).filter(e => norm(e.name).includes(n));
    const exs = S.exceptions.filter(x => norm(x.name).includes(n));
    S.resolve = (ents.length || exs.length) ? { mode: 'results', ents, exs, query: q } : { mode: 'notfound', query: q, r };
  } else if (r.status === 'resolved') {
    S.resolve = { mode: 'entity', ses: r.canonical, via: r.via, rule: r.rule, query: q };
    S.treeOpen = {}; S.treeDefault = null;
    S.ledgerF = { sys: 'All', status: 'All', settle: 'All' };
    if (r.canonical === 'SES-8842-ACME') complete('search');
  } else {
    S.resolve = { mode: r.status === 'not_found' ? 'notfound' : r.status, query: q, r };
  }
  $('#q-top').value = q;
  go('resolve');
}

/* The stamping pipeline: resolve both sides, inject only when both resolve uniquely */
function processPayload(sc) {
  const input = payloadFor(sc);
  const src = resolveId(sc.src), dst = resolveId(sc.dst);
  const failed = src.status !== 'resolved' ? { side: 'source', id: sc.src, r: src, stage: 1 } : dst.status !== 'resolved' ? { side: 'destination', id: sc.dst, r: dst, stage: 2 } : null;
  if (!failed) {
    const se = S.entities[src.canonical], de = S.entities[dst.canonical];
    const gate = gateCheck(sc, src, dst), pe = gate.party;
    if (gate.fail) {
      const output = [...input.map(e => [...e]),
        ['identity_status', 'RESOLVED', 'held'],
        ['nexus_decision', 'BLOCKED', 'held', 'pre-flight'],
        ['blocked_at', gate.fail.at, 'held'],
        ['reason', gate.fail.code, 'held'],
        ['persisted', false, 'held']];
      return { kind: 'gate', input, output, src, dst, sc, gate, failed: { stage: gate.fail.stage } };
    }
    const added = [
      ['source_canonical_id', src.canonical, 'inj', 'injected'],
      ['destination_canonical_id', dst.canonical, 'inj', 'injected'],
      ['tenant_metadata', [['tenant_id', pe.tenant], ['source_parent_entity', se.parent || se.id], ['destination_parent_entity', de.parent || de.id], ['region', pe.region.toLowerCase()]], 'inj2', 'tenant metadata'],
      ['provider_routing', [['rail', gate.rail.toLowerCase()], ['provider', gate.provider.name], [gate.provider.kind.includes('MXM') ? 'merchant_id' : 'account_id', gate.provider.id]], 'inj2', 'provider routing'],
      ['identity_resolution', [['method', 'exact_unique_mapping'], ['registry_version', `r${S.regVersion}`], ['simulated', true]], 'inj2', 'resolution metadata']
    ];
    const output = [...input.map(e => [...e]), ...added];
    return { kind: 'ok', input, output, src, dst, sc, gate, addedCount: added.length };
  }
  const reason = { not_found: 'no_registry_mapping', conflict: 'conflicting_identity', ambiguous: 'ambiguous_mapping' }[failed.r.status];
  const exRef = failed.r.ex?.id;
  const output = [...input.map(e => [...e]),
    ['identity_status', 'UNRESOLVED', 'held', 'blocked'],
    ['unresolved_identity', keyFor(failed.side, failed.id), 'held'],
    ['reason', reason, 'held'],
    ...(exRef ? [['exception_ref', exRef, 'held']] : []),
    ['persisted', false, 'held']];
  return { kind: 'blocked', input, output, src, dst, sc, failed, reason, exRef };
}

function checksHTML(res) {
  const row = (cls, title, d, extra = '') => `<div class="check ${cls}"><span class="ci">${ic(cls === 'ok' ? 'check' : cls === 'bad' ? 'x' : 'alert', 12, 2.6)}</span><div><b>${title}</b><span class="d">${d}</span></div>${extra}</div>`;
  const side = (label, id, r) => r.status === 'resolved'
    ? row('ok', `${label} identity resolved`, `<span class="mono">${id}</span> → <span class="mono">${r.canonical}</span> · exact unique mapping`)
    : row(r.status === 'not_found' ? 'bad' : 'warn', `${label} identity unresolved`, `<span class="mono">${id}</span> ${describe(r)}. ${{ not_found: 'Rule 2: no canonical ID is invented.', conflict: 'Rule 3: routed to the exception queue.', ambiguous: 'Rule 4: no entity is selected.' }[r.status]}`);
  const inKeys = res.input.map(e => e[0]);
  const unchanged = res.input.filter(([k, v]) => { const o = res.output.find(x => x[0] === k); return o && o[1] === v; }).length;
  let html = side('Source', res.sc.src, res.src);
  html += res.src.status === 'resolved' ? side('Destination', res.sc.dst, res.dst) : '';
  if (res.failed?.side === 'source') html += row('warn', 'Destination not evaluated', 'The pipeline stops at the first unresolved identity.');
  if (res.gate) { const g = res.gate, f = g.fail?.stage;
    html += f === 3 ? row('bad', 'Tenant not authorized', esc(g.fail.detail)) : row('ok', 'Tenant authorized', `Caller tenant <span class="mono">${g.caller}</span> owns <span class="mono">${g.party.id}</span>`);

    if (f !== 3 && f !== 4) html += f === 5 ? row('bad', 'No provider identity', esc(g.fail.detail)) : row('ok', 'Provider resolved', `<span class="mono">${g.party.id}</span> → ${g.provider.kind} <span class="mono">${g.provider.id}</span> · ${g.provider.use}`);
  }
  html += row('ok', 'Legacy fields unchanged', `${unchanged} of ${inKeys.length} original fields are identical in the output`);
  if (res.kind === 'ok') {
    html += row('ok', 'Additive change only', `${res.addedCount} fields added · 0 removed · 0 modified`);
    html += row('ok', 'Persisted to the simulated transaction store', `<span class="mono">${res.input[0][1]}</span> · status STAMPED · routed to ${res.gate.provider.name}`, `<button class="btn btn-sm" data-action="view-ledger">View in ledger</button>`);
  } else {
    if (res.kind === 'gate') { html += row('bad', 'Blocked before the Unified Transaction API', 'Nexus Bridge stopped the transaction at pre-flight, so orchestration was never called.'); html += row('bad', 'Not persisted', 'No canonical IDs were injected and nothing was sent downstream.'); return `<div class="checks">${html}</div><div class="check-foot">Simulated compatibility check. It compares the output with the incoming request. No downstream systems were called.</div>`; }
    html += row('bad', 'Stamping blocked', 'Required identities are unresolved, so no canonical IDs were injected.');
    html += row('bad', 'Not persisted', res.exRef ? `Held against review ${res.exRef}.` : 'Held until the identifier is mapped.', res.exRef ? `<button class="btn btn-sm" data-action="review" data-ex="${res.exRef}">Open ${res.exRef}</button>` : '');
  }
  return `<div class="checks">${html}</div><div class="check-foot">Simulated compatibility check. It compares the output with the incoming request. No downstream systems were called.</div>`;
}

async function runSim() {
  if (S.sim.status === 'running') return;
  const sc = SCEN[S.sim.scenario];
  S.sim.status = 'running'; S.sim.result = null; S.sim.stage = 0; renderSim();
  const res = processPayload(sc);
  const last = res.kind === 'ok' ? STAGES.length - 1 : res.failed.stage;
  for (let i = 0; i <= last; i++) { S.sim.stage = i; if (S.view === 'simulator') renderSim(); await sleep(i === 0 ? 180 : 110); }
  S.sim.status = 'done'; S.sim.result = res;
  const txnId = res.input[0][1];
  if (res.kind === 'ok') {
    S.txns.unshift({ id: txnId, sys: sc.ledgerSys || 'ACH', ts: nowStr(), src_legacy: sc.src, dst_legacy: sc.dst, src_can: res.src.canonical, dst_can: res.dst.canonical, amount: sc.amount, ccy: 'USD', status: 'Pending', settle: 'Pending', stamped: true, fresh: true });
    toast('Identity stamped deterministically in 14ms (simulated).', `${res.src.canonical} → ${res.dst.canonical} · ${txnId} persisted · routed to ${res.gate.provider.name}`);
    logAudit({ actor: 'Nexus Bridge', kind: 'sys', ev: 'Identity stamped', ent: txnId, detail: `${sc.src} → ${res.src.canonical}, ${sc.dst} → ${res.dst.canonical}. ${res.input.length} legacy fields preserved.` });
    complete('stamp');
    if (S.sim.scenario === 'coffee') complete('route');
  } else if (res.kind === 'gate') {
    const g = res.gate;
    toast(g.fail.toast, g.fail.sub, 'bad');
    logAudit({ actor: 'Nexus Bridge', kind: 'sys', ev: 'Pre-flight blocked', ent: txnId, detail: `${g.fail.detail} Not sent to the Unified Transaction API.` });
    if (S.sim.scenario === 'pending') complete('gate');
  } else {
    const ex = res.failed.r.ex;
    if (ex && !ex.heldTxns.includes(txnId)) ex.heldTxns.push(txnId);
    toast(res.failed.r.status === 'not_found' ? 'Stamping blocked: no registry mapping.' : res.failed.r.status === 'conflict' ? 'Stamping blocked: conflicting identity.' : 'Stamping blocked: ambiguous mapping.', `${res.failed.id} unresolved · transaction not persisted`, res.failed.r.status === 'not_found' ? 'bad' : 'warn');
    logAudit({ actor: 'Nexus Bridge', kind: 'sys', ev: 'Stamping blocked', ent: txnId, detail: `${res.failed.id} ${describe(res.failed.r)}. Not persisted.${res.exRef ? ` Held against ${res.exRef}.` : ''}` });
    if (S.sim.scenario === 'missing') complete('missing');
  }
  if (S.view === 'simulator') renderSim();
}

/* ============ Identity layer: authorization, entitlement gate, provider translation ============ */
const RAILS = ['ACH', 'Card', 'Payout'];
function providerFor(ent, rail) {
  const pv = ent.providers || {};
  return rail === 'Card'
    ? { name: 'MXM', kind: 'MXM merchant ID', id: pv.mxm, use: 'card acquiring' }
    : { name: 'Passport Banking PaaS', kind: 'Passport account ID', id: pv.passport, use: rail === 'Payout' ? 'payouts' : 'ACH origination' };
}
function gateCheck(sc, src, dst) {
  const partyRes = sc.party === 'destination' ? dst : src;
  const pe = S.entities[partyRes.canonical];
  const caller = sc.caller || 'TNT-NA-01', rail = sc.rail || 'ACH';
  const g = { party: pe, partyLegacy: sc.party === 'destination' ? sc.dst : sc.src, caller, rail };
  if (pe.tenant !== caller) {
    g.fail = { stage: 3, at: 'tenant_authorization', code: 'tenant_access_denied', short: 'tenant denied',
      detail: `Caller tenant ${caller} cannot act on ${pe.id}, which belongs to ${pe.tenant}.`,
      toast: 'Blocked: this caller is not authorized for the entity.', sub: `${caller} → ${pe.id} (owned by ${pe.tenant})` };
    return g;
  }
  const status = pe.status !== 'Active' ? 'PENDING' : (pe.products?.[rail] || 'NOT_ENROLLED');
  if (status !== 'ACTIVE') {
    g.fail = { stage: 4, at: 'entitlement_check', code: `entitlement_${status.toLowerCase()}`, short: `${rail} ${status.toLowerCase().replace('_', ' ')}`, status,
      detail: `${rail} is ${status} for ${pe.id}. ${pe.gateNote || ''}`.trim(),
      toast: `Blocked at pre-flight: ${rail} is ${status} for ${pe.name}.`, sub: 'Stopped before the Unified Transaction API' };
    return g;
  }
  const prov = providerFor(pe, rail);
  if (!prov.id) {
    g.fail = { stage: 5, at: 'provider_resolution', code: 'no_provider_account', short: 'no provider ID',
      detail: `${pe.id} has no ${prov.kind} for ${prov.use}.`, toast: 'Blocked: no provider identity for this rail.', sub: `${pe.id} · ${prov.name}` };
    return g;
  }
  g.provider = prov;
  return g;
}
function publishEvent(topic, ent, detail) { S.events.unshift({ t: nowStr(), topic, ent, detail }); S.cacheVersion++; }
function techBlock(key, items) {
  return `<details class="tech" data-keep="${key}" ${S.keepOpen?.[key] ? 'open' : ''}><summary>${ic('chev', 13, 2)}Technical details</summary>
    <div class="tech-body">${items.map(([h, line, pre]) => `<div class="tech-item"><h4>${h}</h4>${line ? `<p class="${/^(GET|POST|redis) /.test(line) ? 'mono' : ''}">${esc(line)}</p>` : ''}${pre ? `<pre class="snip">${esc(pre)}</pre>` : ''}</div>`).join('')}</div></details>`;
}
const prodChips = (ent, rail) => RAILS.filter(r => ent.products && r in ent.products).map(r => { const v = ent.products[r];
  return `<span class="prod ${v === 'ACTIVE' ? 'on' : v === 'NOT_ENROLLED' ? 'no' : 'off'} ${r === rail ? 'req' : ''}" title="${r}: ${v}">${r} ${v === 'ACTIVE' ? '✓' : v === 'NOT_ENROLLED' ? '—' : '!'}</span>`; }).join('');

/* Decision trace shown after each simulation run */
function traceHTML(res) {
  const sc = res.sc, rows = [];
  const R = (state, l, v, cls = '') => rows.push(`<div class="chain-row ${state} ${cls}"><span class="ci">${state === 'ok' ? ic('check', 12, 2.6) : state === 'fail' ? ic('x', 12, 2.6) : ''}</span><span class="l">${l}</span><span class="v">${v}</span></div>`);
  let tech;
  if (res.kind === 'blocked') {
    R('ok', 'Legacy ID', `<span class="mono">${res.failed.id}</span><span class="muted">${sysOf(res.failed.id)}</span>`);
    R('fail', 'SES entity', `Unresolved · ${describe(res.failed.r)}`);
    ['Merchant', 'Tenant access', 'Status', 'Products', 'Provider routing', 'Unified Transaction API'].forEach(l => R('skip', l, 'Not reached'));
    R('fail', 'Result', 'Transaction blocked · identity unresolved', 'final');
    tech = [['Registry lookup', `GET /v1/identity/resolve?id=${res.failed.id}`, JSON.stringify({ status: 'unresolved', reason: res.reason, exception_id: res.exRef || null }, null, 2)],
            ['Cache (Redis)', `redis GET nb:map:${res.failed.id}`, 'miss · no unique mapping cached']];
  } else {
    const g = res.gate, pe = g.party, f = g.fail?.stage || 0, before = n => f && f < n;
    R('ok', 'Legacy ID', `<span class="mono">${g.partyLegacy}</span><span class="muted">${sysOf(g.partyLegacy)} · ${sc.party === 'destination' ? 'destination' : 'source'} party</span>`);
    R('ok', 'SES entity', `<span class="mono">${pe.id}</span>`);
    R('ok', 'Merchant', esc(pe.name));
    R(f === 3 ? 'fail' : 'ok', 'Tenant access', f === 3 ? `Denied · caller ${g.caller}, owner ${pe.tenant}` : `Caller <span class="mono">${g.caller}</span> owns this entity`);
    R(before(4) ? 'skip' : pe.status === 'Active' ? 'ok' : 'fail', 'Status', before(4) ? 'Not reached' : pe.status === 'Active' ? 'ACTIVE' : 'PENDING');
    R(before(4) ? 'skip' : f === 4 ? 'fail' : 'ok', 'Products', before(4) ? 'Not reached' : `${prodChips(pe, g.rail)}<span class="muted">${g.rail} requested${f === 4 ? ` · ${g.fail.status}` : ''}</span>`);
    R(before(5) ? 'skip' : f === 5 ? 'fail' : 'ok', 'Provider routing', before(5) ? 'Not reached' : f === 5 ? g.fail.detail : `${g.provider.name} · <span class="mono">${g.provider.id}</span>`);
    R(f ? 'skip' : 'ok', 'Unified Transaction API', f ? 'Not called' : `<span class="mono">POST /v1/transactions</span>`);
    R(f ? 'fail' : 'ok', 'Result', f ? `Transaction blocked at ${g.fail.at.replace('_', ' ')}` : 'Transaction proceeds', 'final');
    const leg = (side) => { const r = side === 'source' ? res.src : res.dst; const isParty = (sc.party || 'source') === side;
      return { [isParty ? 'party' : 'counterparty']: { tenant_entity_id: r.canonical } }; };
    const pv = pe.providers || {};
    tech = [
      ['Caller token', 'Claims extracted from the bearer token', JSON.stringify({ tenantId: g.caller, ownerId: `usr_${g.caller.slice(-2)}ops`, scope: ['transactions:write'] }, null, 2)],
      ['Tenant validation (SES)', `GET /v1/entities/${pe.id}?tenantId=${g.caller}`, f === 3 ? '403 Forbidden · entity owned by ' + pe.tenant : `200 OK · owner ${pe.tenant}`],
      ['Entitlement lookup', `GET /v1/businesses/${pe.id}/locations/${pe.location || ':id'}/services`, f === 3 ? 'not called' : JSON.stringify({ status: pe.status === 'Active' ? 'ACTIVE' : 'PENDING', services: RAILS.filter(r => pe.products && r in pe.products).map(r => ({ rail: r, status: pe.products[r] })) }, null, 2)],
      ['Provider translation', 'One canonical ID, provider IDs underneath', `${pe.id} → ${pv.mxm || 'none'}  (MXM merchant ID · card / ACH acquiring)\n${pe.id} → ${pv.passport || 'none'}  (Passport / Banking PaaS · payouts, wires, ACH origination)`],
      ['Unified Transaction API request', f ? 'Not sent. Blocked by Nexus Bridge pre-flight.' : 'POST /v1/transactions', JSON.stringify({ source: leg('source'), destination: leg('destination'), rail: g.rail.toLowerCase(), amount: sc.amount, currency: 'USD', ...(g.provider ? { provider_ref: { provider: g.provider.name, [g.provider.kind.includes('MXM') ? 'merchant_id' : 'account_id']: g.provider.id } } : {}) }, null, 2)],
      ['Cache (Redis)', `redis GET nb:ent:${pe.id}`, `hit · cache v${S.cacheVersion}${(() => { const ev = S.events.find(e => e.ent === pe.id); return ev ? `\nlast update: ${ev.topic}` : ''; })()}`]
    ];
  }
  return `<div class="card"><div class="card-head"><h2>${ic('link')}Nexus Bridge decision</h2><span class="muted" style="font-size:12.5px">identity · authorization · entitlement · routing</span><div class="right"><span class="sim-tag">Simulated</span></div></div>
    <div class="chain">${rows.join('')}</div>${techBlock('trace', tech)}</div>`;
}

        <td class="r"><button class="btn btn-sm" data-action="resolve" data-q="${x.legacy}">Search ${x.legacy}</button></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty-state"><div class="ic-wrap">${ic('list', 20)}</div><p>No exceptions resolved yet. Decisions you make appear here.</p></div>`)}
  </div>`;
}

function openReview(id) {
  const x = S.exceptions.find(e => e.id === id);
  if (!x) { const c = S.closed.find(e => e.id === id); toast(c ? `${id} is already resolved: ${c.outcome}.` : `${id} was not found.`, '', 'info'); return; }
  S.openEx = id; S.confirm = null;
  if (S.view !== 'exceptions') { S.queueTab = 'open'; go('exceptions'); }
  renderSheet();
  const sheet = $('#sheet'), scrim = $('#scrim');
  sheet.hidden = false; scrim.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add('open'); scrim.classList.add('open'); });
  setTimeout(() => sheet.querySelector('.sheet-foot .btn:not([disabled])')?.focus(), 250);
  if (id === 'EX-3021') complete('review');
}
function closeReview() {
  const sheet = $('#sheet'), scrim = $('#scrim');
  sheet.classList.remove('open'); scrim.classList.remove('open');
  S.openEx = null; S.confirm = null;
  setTimeout(() => { if (!S.openEx) { sheet.hidden = true; scrim.hidden = true; } }, 280);
}
const approvable = x => x.candidates.length === 1 && x.evidence.every(e => e[1]);

function renderSheet() {
  const x = S.exceptions.find(e => e.id === S.openEx); if (!x) return;
  const stLbl = { match: ['check', 'Match'], similar: ['info', 'Similar'], conflict: ['x', 'Conflict'], missing: ['alert', 'Missing'], split: ['alert', 'Matches one'], info: ['info', 'Context'] };
  const one = x.candidates.length === 1, ok = approvable(x);
  const rule = {
    conflict: ['bad', 'Rule 3 · Conflicting identity', 'A hard identity attribute differs from the existing entity. A similar name is not enough, so Nexus Bridge routes the record here and never merges it.'],
    ambiguous: ['', 'Rule 4 · Ambiguous mapping', 'The identifier maps to more than one entity. Nexus Bridge will not pick one arbitrarily, so the record stays unresolved.'],
    unmapped: ['', 'Rule 2 · Missing mapping', 'The identifier has no entry in the Nexus Registry. Nexus Bridge never invents a canonical ID to make a transaction look successful.']
  }[x.type];
  const failing = x.evidence.find(e => !e[1]);
  const cand = x.candidates[0];
  let foot;
  if (S.confirm === 'approve') {
    foot = `<div class="guard"><p><b>Approve mapping <span class="mono">${x.legacy}</span> → <span class="mono">${cand}</span>?</b> The registry gains this mapping, and future transactions using ${x.legacy} will be stamped with ${cand}.</p>
      <div class="row"><button class="btn btn-primary" data-action="approve-confirm">${ic('check', 14, 2.2)}Confirm mapping</button><button class="btn btn-ghost" data-action="confirm-cancel">Cancel</button></div></div>`;
  } else if (S.confirm === 'reject') {
    foot = `<div class="guard"><p><b>Reject the proposed mapping${one ? ` to <span class="mono">${cand}</span>` : 's'}?</b> ${x.legacy} stays unresolved in the registry, and transactions that use it will keep being blocked.</p>
      <div class="row"><button class="btn btn-danger" data-action="reject-confirm">Reject mapping</button><button class="btn btn-ghost" data-action="confirm-cancel">Cancel</button></div></div>`;
  } else {
    const approveBtn = `<button class="btn ${ok ? 'btn-primary' : ''}" data-action="approve" ${ok ? '' : 'disabled'} title="${ok ? '' : 'Not permitted by the mapping rules'}">${ic('link', 14)}Approve mapping${one ? ` to ${cand}` : ''}</button>`;
    const createBtn = `<button class="btn ${ok ? '' : 'btn-primary'}" data-action="isolate">${ic('plus', 14, 2.2)}Create New Independent Entity</button>`;
    foot = `<div class="row">${ok ? approveBtn + createBtn : createBtn + approveBtn}</div>
      <div class="row"><button class="btn btn-sm" data-action="escalate" ${x.status === 'ESCALATED' ? 'disabled' : ''}>${ic('up', 13)}${x.status === 'ESCALATED' ? 'Escalated' : 'Escalate for manual review'}</button>
        ${x.candidates.length ? `<button class="btn btn-sm btn-danger" data-action="reject">${ic('ban', 13)}Reject proposed mapping</button>` : ''}
        <button class="btn btn-sm btn-ghost" data-action="close">Leave for further review</button></div>
      <p class="hint">${ok ? 'The mapping rules are satisfied, so approval is available.' : `Approval is not available: ${failing ? `${failing[0].toLowerCase()} (${failing[2]})` : 'rules not met'}.`} Creating a new entity gives ${x.legacy} its own canonical ID and links nothing else.</p>`;
  }
  $('#sheet').innerHTML = `
  <div class="sheet-head">
    <div style="min-width:0">
      <h2 id="sheet-title">Review ${x.id} <span class="pill sm ${TYPE[x.type][0]}">${TYPE[x.type][1]}</span> ${statusPill(x)}</h2>
      <p>Received ${x.received} · <span class="mono">${x.legacy}</span> · ${esc(x.reason)}</p>
    </div>
    <button class="btn btn-ghost btn-icon" style="margin-left:auto" data-action="close" aria-label="Close">${ic('x', 16)}</button>
  </div>
  <div class="sheet-body">
    <div class="why ${rule[0]}"><div class="h">${ic(x.type === 'conflict' ? 'ban' : 'alert', 15)}Why automatic resolution was prevented · ${rule[1]}</div><p>${rule[2]}</p></div>

    <div><div class="sec-title">Incoming record vs existing SES record${x.candidates.length > 1 ? 's' : ''}</div>
    <div class="cmp-table"><div class="table-wrap"><table>
      <thead><tr><th>Field</th><th>Incoming record<span class="id">${x.legacy}</span><span class="nm2">${esc(x.name)}</span></th>
        ${x.candidates.length ? x.candidates.map(c => `<th>Existing SES record<span class="id">${c}</span><span class="nm2">${esc(S.entities[c].name)}</span></th>`).join('') : '<th>Existing SES record<span class="nm2">No matching entity</span></th>'}
        ${one ? '<th></th>' : ''}</tr></thead>
      <tbody>${x.fields.map(([f, a, bs, st]) => `<tr class="${st === 'conflict' || st === 'missing' || st === 'split' ? st : ''}"><td>${f}</td><td>${esc(a)}</td>
        ${x.candidates.length ? bs.map(b => `<td class="${!one && b === a ? 'eq' : ''}">${esc(b)}</td>`).join('') : '<td class="faint">—</td>'}
        ${one ? `<td><span class="st ${st}">${ic(stLbl[st][0], 12, 2.2)}${stLbl[st][1]}</span></td>` : ''}</tr>`).join('')}</tbody>
    </table></div></div></div>

    <div><div class="sec-title">Mapping rules check</div>

/* ---- Exception actions ---- */
function closeException(x, outcome, outcomeCls) {
  S.closed.unshift({ ...x, outcome, outcomeCls, closedAt: nowStr() });
  S.exceptions = S.exceptions.filter(e => e.id !== x.id);
  S.regVersion++;
}
function animateRowOut(id, after) {
  const row = document.querySelector(`tr[data-row="${id}"]`);
  if (row) row.classList.add('leaving');
  setTimeout(after, 360);
}
function actCreateEntity() {
  const x = S.exceptions.find(e => e.id === S.openEx); if (!x) return;
  const t = nowStr(), sys = sysOf(x.legacy);
  S.registry = S.registry.filter(r => norm(r.legacy) !== norm(x.legacy));
  S.registry.push({ legacy: x.legacy, canonical: x.newId, role: x.create.role, rule: `manual isolation (${x.id})`, since: 'Sep 28, 2026' });
  const sa = `SA-${x.newId.split('-')[1]}-01`;
  S.entities[x.newId] = {
    id: x.newId, name: x.name, type: 'Operating entity', status: 'Active', parent: null, taxId: x.create.taxId, mcc: x.candidates[0] ? S.entities[x.candidates[0]].mcc : 'Pending classification',
    region: x.candidates[0] ? S.entities[x.candidates[0]].region : 'US-East', since: 'Sep 28, 2026', tenant: 'TNT-NA-01',
    subaccounts: [{ id: sa, name: sys === 'Passport' ? 'Onboarding' : 'Operating', ccy: x.create.ccy, avail: 0, pending: 0, legacy: x.legacy, instruments: [{ id: `PI-${x.newId.split('-')[1]}`, label: x.create.bank, kind: 'Bank account' }] }],
    volume: { [x.create.ccy]: 0 }, isolatedFrom: { ex: x.id, from: x.candidates, t }
  };
  closeException(x, `New entity ${x.newId}`, 'ok');
  closeReview();
  animateRowOut(x.id, render);
  toast('New SES Canonical ID generated for safe isolation.', `${x.legacy} → ${x.newId}`, 'ok', { label: 'View entity', q: x.legacy });
  logAudit({ actor: 'You · Support Ops', kind: 'person', ev: 'Created independent entity', ent: x.newId, detail: `${x.legacy} isolated after review ${x.id}. Registry updated to r${S.regVersion}.${x.candidates.length ? ` Nothing linked to ${x.candidates.join(' or ')}.` : ''}` });
  Object.assign(S.entities[x.newId], { products: { ACH: 'ACTIVE', Card: 'PENDING', Payout: 'PENDING' }, providers: { mxm: sys === 'MXM' ? x.legacy : null, passport: `PBA-${x.newId.split('-')[1]}-01` }, location: `LOC-${x.newId.split('-')[1]}-01` });
  publishEvent('ses.entity.created', x.newId, `${x.name} · isolated by review ${x.id}`);
  if (x.id === 'EX-3021') complete('isolate');
}
function actApprove() {
  const x = S.exceptions.find(e => e.id === S.openEx); if (!x || !approvable(x)) { toast('Approval is not permitted for this record.', '', 'bad'); return; }
  const cand = x.candidates[0];
  S.registry.push({ legacy: x.legacy, canonical: cand, role: x.create.role, rule: `tax_id + bank_acct (approved ${x.id})`, since: 'Sep 28, 2026' });
  closeException(x, `Mapped to ${cand}`, 'ok');
  closeReview();
  animateRowOut(x.id, render);
  toast('Mapping approved and added to the Nexus Registry.', `${x.legacy} → ${cand} · r${S.regVersion}`, 'ok', { label: 'View entity', q: x.legacy });
  logAudit({ actor: 'You · Support Ops', kind: 'person', ev: 'Mapping approved', ent: x.legacy, detail: `Linked to ${cand}. Evidence: exact Tax ID and settlement bank. Registry r${S.regVersion}.` });
  publishEvent('ses.entity.updated', cand, `Mapping added: ${x.legacy} (review ${x.id})`);
  complete('approve');
}
function actReject() {
  const x = S.exceptions.find(e => e.id === S.openEx); if (!x) return;
  S.registry = S.registry.filter(r => norm(r.legacy) !== norm(x.legacy));
  closeException(x, 'Mapping rejected', 'bad');
  closeReview();
  animateRowOut(x.id, render);
  toast('Proposed mapping rejected. The identifier stays unresolved.', `${x.legacy} · transactions using it remain blocked`, 'warn');
  logAudit({ actor: 'You · Support Ops', kind: 'person', ev: 'Mapping rejected', ent: x.legacy, detail: `Rejected mapping to ${x.candidates.join(', ')} in ${x.id}. Registry r${S.regVersion}.` });
}
function actEscalate() {
  const x = S.exceptions.find(e => e.id === S.openEx); if (!x) return;
  x.status = 'ESCALATED';
  renderSheet(); renderQueue(); renderNav();
  toast('Escalated to Risk Operations for manual review.', `${x.id} stays unresolved`, 'info');
  logAudit({ actor: 'You · Support Ops', kind: 'person', ev: 'Escalated', ent: x.legacy, detail: `${x.id} sent to Risk Operations. No registry change.` });
}

function renderActivity() {

/* ============ Toasts ============ */
function toast(msg, sub = '', kind = 'ok', action) {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = `${ic(kind === 'ok' ? 'check' : kind === 'info' ? 'info' : 'alert', 16, 2.2)}<div class="msg">${esc(msg)}${sub ? `<span>${esc(sub)}</span>` : ''}</div>${action ? `<button class="btn btn-sm">${action.label}</button>` : ''}`;
  const dismiss = () => { t.classList.add('out'); setTimeout(() => t.remove(), 260); };
  if (action) t.querySelector('button').onclick = () => { resolve(action.q); dismiss(); };
  $('#toasts').appendChild(t);
  setTimeout(dismiss, action ? 6500 : 4200);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a || a.disabled) return;
  const d = a.dataset;
  switch (d.action) {
    case 'nav': if (d.view === 'resolve' && S.view === 'resolve') S.resolve = { mode: 'overview' }; go(d.view); break;
    case 'overview': S.resolve = { mode: 'overview' }; $('#q-top').value = ''; go('resolve'); break;
    case 'resolve': resolve(d.q); break;
    case 'hero-search': e.preventDefault(); resolve($('#q-hero').value); break;
    case 'tree': S.treeOpen[d.key] = d.state !== '1'; complete('tree'); renderResolve(); break;
    case 'tree-all': S.treeOpen = {}; S.treeDefault = d.v; renderResolve(); break;
    case 'clear-filters': S.ledgerF = { sys: 'All', status: 'All', settle: 'All' }; renderResolve(); break;
    case 'copy': {
      const ok = () => toast('Canonical ID copied.', d.text), fail = () => toast('Copy is blocked here. Select the ID to copy it.', d.text, 'warn');
      try { navigator.clipboard.writeText(d.text).then(ok, fail); } catch (err) { fail(); }
      break;
    }
    case 'to-sim': setScenario('clean'); go('simulator'); break;
    case 'scenario': setScenario(d.s); renderSim(); break;
    case 'sim-run': runSim(); break;
    case 'view-ledger': { const r = S.sim.result; if (r?.src?.canonical) { resolve(r.sc.src); setTimeout(() => document.getElementById('ledger')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); } break; }
    case 'qtab': S.queueTab = d.t; renderQueue(); break;
    case 'review': openReview(d.ex); break;
    case 'close': closeReview(); break;
    case 'isolate': actCreateEntity(); break;
    case 'approve': S.confirm = 'approve'; renderSheet(); break;
    case 'approve-confirm': actApprove(); break;
    case 'reject': S.confirm = 'reject'; renderSheet(); break;
    case 'reject-confirm': actReject(); break;
    case 'confirm-cancel': S.confirm = null; renderSheet(); break;
    case 'escalate': actEscalate(); break;
    case 'theme': applyTheme(document.documentElement.getAttribute('data-app-theme') === 'dark' ? 'light' : 'dark'); break;
    case 'guide-toggle': S.guideCollapsed = !S.guideCollapsed; S.guideTouched = true; renderGuide(); break;
    case 'guide-go': STEPS.find(s => s.id === d.step).run(); break;
    case 'run-example': setScenario(d.s); go('simulator'); break;
    case 'ev-onboard': {
      const b = S.entities['SES-10311'];

      b.providers.passport = 'PBA-10311-01';

      toast('SES events applied to the Nexus Bridge cache.', `SES-10311 · cache v${S.cacheVersion}`, 'info');
      logAudit({ actor: 'SES via Kafka', kind: 'sys', ev: 'Entitlement changed', ent: b.id, detail: 'Onboarding completed. ACH, Card and Payout are ACTIVE. Cache refreshed.' });
      setScenario(S.sim.scenario); renderSim(); break;
    }
    case 'ev-hold': {

  }
});
